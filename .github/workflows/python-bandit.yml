name: Bandit SAST Scan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Bandit
        run: python -m pip install bandit

      - name: Analizar archivos Python
        run: bandit -r . -x ./.git -f json -o bandit-report.json --exit-zero

      - name: Guardar reporte de Bandit
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
